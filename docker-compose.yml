services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: orders123
      POSTGRES_DB: ordersdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ordersdb"]
      interval: 3s
      retries: 10

  validator:
    build: .
    command: python jobs/validate_orders.py
    volumes:
      - ./data:/app/data
      - ./output:/app/output

  loader:
    build: .
    command: python jobs/load_to_postgres.py
    environment:
      PG_HOST: postgres
    volumes:
      - ./output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
      validator:
        condition: service_completed_successfully

volumes:
  pgdata:
